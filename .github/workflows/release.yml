name: Build and release macOS app

on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - 'Sources/**'
      - 'build.sh'
      - '.github/workflows/release.yml'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing version tag to build and publish (leave empty for test build)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
            label: Apple-Silicon
          - runner: macos-15-intel
            arch: x86_64
            label: Intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - name: Validate recovery tag
        env:
          RECOVERY_TAG: ${{ inputs.release_tag }}
        run: |
          if [[ -n "$RECOVERY_TAG" && ! "$RECOVERY_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'Recovery tag must have the format v1.2.3.' >&2
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - name: Determine version
        shell: bash
        env:
          REF_TYPE: ${{ inputs.release_tag && 'tag' || github.ref_type }}
          REF_NAME: ${{ inputs.release_tag || github.ref_name }}
        run: |
          if [[ "$REF_TYPE" == "tag" ]]; then
            if [[ ! "$REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo 'Release tags must have the format v1.2.3.' >&2
              exit 1
            fi
            echo "VERSION=${REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo 'VERSION=0.0.0' >> "$GITHUB_ENV"
          fi
      - name: Build, sign locally, and test
        env:
          ARCH: ${{ matrix.arch }}
          BUILD_NUMBER: ${{ github.run_number }}
          OUTPUT_DIR: ${{ runner.temp }}/qr-studio-build
        run: bash build.sh
      - name: Package application
        env:
          ARCH_LABEL: ${{ matrix.label }}
          BUILD_DIR: ${{ runner.temp }}/qr-studio-build
        run: |
          mkdir -p release-assets
          archive="QR-Studio-${VERSION}-macOS-${ARCH_LABEL}.zip"
          ditto -c -k --sequesterRsrc --keepParent "$BUILD_DIR/QR Studio.app" "release-assets/$archive"
          staging="$RUNNER_TEMP/qr-studio-dmg"
          mkdir -p "$staging"
          ditto "$BUILD_DIR/QR Studio.app" "$staging/QR Studio.app"
          ln -s /Applications "$staging/Applications"
          disk_image="QR-Studio-${VERSION}-macOS-${ARCH_LABEL}.dmg"
          hdiutil create -volname "QR Studio" -srcfolder "$staging" \
            -format UDZO -ov "release-assets/$disk_image"
          hdiutil verify "release-assets/$disk_image"
          cd release-assets
          shasum -a 256 "$archive" > "$archive.sha256"
          shasum -a 256 "$disk_image" > "$disk_image.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: macOS-${{ matrix.arch }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14
      - name: Explain where to find downloads
        env:
          RECOVERY_TAG: ${{ inputs.release_tag }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" == workflow_dispatch && -z "$RECOVERY_TAG" ]]; then
            echo '### Build only — no GitHub Release published' >> "$GITHUB_STEP_SUMMARY"
            echo 'Download ZIP and DMG files from the artifacts on this run. To publish, start a new run from the default branch and set release_tag to an existing version tag such as v1.0.1.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'ZIP and DMG files are uploaded as build artifacts. The release job publishes them after both architectures pass.' >> "$GITHUB_STEP_SUMMARY"
          fi

  release:
    name: Publish GitHub Release
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: macOS-*
          path: release-assets
          merge-multiple: true
      - name: Publish release with downloads
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        shell: bash
        run: |
          cat > release-notes.md <<'NOTES'
          Download **Apple-Silicon** for M-series Macs or **Intel** for Intel Macs. Requires macOS 12 or newer.

          Open the DMG and drag QR Studio.app to Applications, or unzip the ZIP and move the app to Applications. Use the QR icon in the menu bar to generate or drag out a transparent vector SVG.

          These builds are ad-hoc signed, not Apple Developer ID signed or notarized. macOS Gatekeeper may block downloaded copies. SHA-256 checksum files are included.
          NOTES
          # Recover an existing release by adding missing files, never replacing downloads.
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "QR Studio $RELEASE_TAG" --notes-file release-notes.md --generate-notes
          fi
          existing_assets="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')"
          for asset in release-assets/*; do
            name="$(basename "$asset")"
            if printf '%s\n' "$existing_assets" | grep -Fxq "$name"; then
              echo "Keeping existing asset: $name"
            else
              gh release upload "$RELEASE_TAG" "$asset"
            fi
          done
          if [[ "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" == true ]]; then
            gh release edit "$RELEASE_TAG" --draft=false
          fi
